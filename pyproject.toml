[project]
name = "bank-genai-operations-assistant"
version = "0.1.0"
description = "POC local de um assistente operacional bancario com LangGraph, RAG, Bedrock e governanca."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
